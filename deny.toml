# Configuration for `cargo deny`, run by the `audit-licenses` flake check.
#
# This holds only the settings that differ from cargo-deny's defaults. For the
# full annotated set of options, see:
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[licenses]
# Every dependency must be under one of these. Add to the list deliberately —
# this is the check that stops a licence you cannot ship sneaking in via a
# transitive dependency.
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  # Permissive, OSI-approved and GPL-compatible. Arrived via foldhash under
  # hashbrown under sqlx, but it goes here rather than in an exception because
  # we would accept it from any crate — the list is for licence classes we are
  # happy with, and a carve-out would imply we are not.
  "Zlib",
  # Match this to the license in the workspace Cargo.toml.
  "GPL-3.0-or-later",
]

# Scoped acceptances: a specific crate whose licence we accept because of what
# that crate *is*. Unlike `allow` above, nothing here generalises.
#
# webpki-root-certs is Mozilla's CA root store — data, not code, which is why
# it carries a data licence. CDLA-Permissive-2.0 imposes no conditions on
# software that merely reads the set. We would not accept it on a code
# dependency, so it is pinned to this one crate rather than allowed outright.
# Reached via rustls-platform-verifier under reqwest.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
# Duplicate versions of a crate are a warning, not an error: they are usually
# someone else's transitive dependency and not yours to fix.
multiple-versions = "warn"
# A wildcard version requirement on a crates.io dependency is a bug waiting to
# happen. Path dependencies on our own unpublished crates are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
# Advisories to ignore, with a reason. Prefer upgrading; reach for this only
# when an advisory does not apply to how you use the crate.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
