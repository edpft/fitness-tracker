[package]
name = "web"
version = "0.3.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The composition root is the one crate allowed to know every adapter.
[dependencies]
application.workspace = true
domain.workspace = true
infrastructure.workspace = true

# Dormant by design (see `main.rs`), so none of the above is used yet. They are
# not speculative: these three path edges are what the `architecture` check
# reads to assert this crate's ring, and dropping them to quiet the scan would
# quietly stop that check watching web at all.
[package.metadata.cargo-machete]
ignored = ["application", "domain", "infrastructure"]

[lints]
workspace = true
