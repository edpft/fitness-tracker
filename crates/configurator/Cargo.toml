[package]
name = "configurator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, rather than one per file (#648).
autotests = false

# The configurator, in Cockburn's sense: the one crate that knows every
# adapter and connects them to the application's ports. `cli` and `web` are
# driving adapters above it, and neither depends on the other.
[dependencies]
application.workspace = true
domain.workspace = true
infrastructure.workspace = true
telemetry.workspace = true

jiff.workspace = true
thiserror.workspace = true
# What is held in memory is derived once however many ask at once (#830).
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Reading back the spans a run leaves in `telemetry.db` (#632).
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
