[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A driving adapter and a composition root: the operator's entry point.
# Extraction is invoked from a terminal or an external scheduler, never over
# HTTP, which is why this is not a subcommand of `web`.
[[bin]]
name = "fitness"
path = "src/main.rs"

[dependencies]
application.workspace = true
domain.workspace = true
infrastructure.workspace = true

clap.workspace = true
jiff.workspace = true
thiserror.workspace = true
tokio.workspace = true
rpassword.workspace = true

[dev-dependencies]
tempfile.workspace = true
# A stub Peloton, for the one test that has to get through an Auth0 login before
# it reaches what it is about. That flow is a redirect chain, a cookie and a
# self-submitting form; the `TcpListener` the other tests stand up would be a
# second implementation of it.
wiremock.workspace = true

[lints]
workspace = true
