[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A driving adapter and a composition root: the operator's entry point.
# Extraction is invoked from a terminal or an external scheduler, never over
# HTTP, which is why this is not a subcommand of `web`.
[[bin]]
name = "fitness"
path = "src/main.rs"

[dependencies]
application.workspace = true
domain.workspace = true
infrastructure.workspace = true

clap.workspace = true
jiff.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
