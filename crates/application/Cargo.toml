[package]
name = "application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test binary, `tests/main.rs`, rather than one per file (#648).
autotests = false

[dependencies]
domain.workspace = true
# A data type, not machinery: prescription is placed on a calendar date, and a
# core that cannot name one ends up passing strings across its own boundaries.
# Allowed here for the same reason it is allowed in `domain`.
jiff.workspace = true
# A data type as well: a drawing is keyed on a digest of what it was drawn
# from (#805), as a delivered rendering is in `domain`.
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/main.rs"
