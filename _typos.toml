[files]
# Payloads and lockfiles are recorded verbatim, not written. Correcting a typo
# in one would corrupt a record rather than fix a word — the landed corpus in
# particular is the bytes Hevy served, and its exercise template ids are hex
# strings that a spellchecker reads as prose.
extend-exclude = [
  "Cargo.lock",
  "flake.lock",
  "**/*.pinned.json",
  "crates/infrastructure/tests/fixtures/*.jsonl",
]

[default.extend-words]
# Don't correct the app name "Hevy"
Hevy = "Hevy"

# Hevy's own title for template `4adc45f1`, reproduced in the mapping comment.
# The titles there are what the source calls a template, not what we call the
# exercise — ours is `pigeon-stretch` and is spelt correctly. Renaming it in the
# app would change the title and not the id, so correcting this would make the
# comment wrong about the record rather than right about English.
Strech = "Strech"

[default.extend-identifiers]
# The plural of SQL's CHECK constraint, in a migration comment. Listed as an
# identifier rather than a word because the splitter reads `CHECKs` as `CHEC`
# plus `Ks`. The word is right, and the fix cannot be to edit the file: sqlx
# checksums an applied migration, so rewriting one breaks the operator's store.
"CHECKs" = "CHECKs"

# Hevy's exercise template ids, quoted in the mapping. They are the source's
# identifiers and are not ours to spell differently: `040BA2E3` reads as `BA`,
# and the fix for a mistyped one is a failing test, not a dictionary.
"040BA2E3" = "040BA2E3"
