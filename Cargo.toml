[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
# An application, not a library. Drop this on any crate you mean to publish.
publish = false

# Hexagonal architecture: dependencies point inward only.
#   web ──▶ infrastructure ──▶ application ──▶ domain
# `web` is the driving adapter and composition root; `infrastructure` holds
# the driven adapters; `application` owns the use cases and the ports both
# sides implement; `domain` is the core and depends on nothing.
[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"

# Constitution § 26: no panics and no unhandled errors.
#
# `forbid`, not `deny`: an `#[allow]` on a forbidden lint is a compile error
# (E0453), so this is not a rule an agent can grant itself an exception to.
# Relaxing it means editing this file, which is visible in review.
#
# Tests keep `unwrap` — the exemptions in `clippy.toml` are configuration, not
# attributes, so they survive `forbid`. A test asserting a value is present is
# not an unhandled error.
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
panic_in_result_fn = "forbid"
exit = "forbid"
# Unfinished code is not a standard to commit against (§ 33).
todo = "forbid"
unimplemented = "forbid"
# Left at `warn`: the noisiest of the set, and the one most likely to have a
# legitimate exception in parsing code.
indexing_slicing = "warn"

# Crane reads this to name the vendored-dependency derivation.
[workspace.metadata.crane]
name = "workspace"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
