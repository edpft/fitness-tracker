[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
# An application, not a library. Drop this on any crate you mean to publish.
publish = false

# Hexagonal architecture: dependencies point inward only.
#   web ──▶ infrastructure ──▶ application ──▶ domain
# `web` is the driving adapter and composition root; `infrastructure` holds
# the driven adapters; `application` owns the use cases and the ports both
# sides implement; `domain` is the core and depends on nothing.
[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"

# Crane reads this to name the vendored-dependency derivation.
[workspace.metadata.crane]
name = "workspace"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
