[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
# An application, not a library. Drop this on any crate you mean to publish.
publish = false

# Hexagonal architecture: dependencies point inward only.
#   web ──▶ infrastructure ──▶ application ──▶ domain
# `web` is the driving adapter and composition root; `infrastructure` holds
# the driven adapters; `application` owns the use cases and the ports both
# sides implement; `domain` is the core and depends on nothing.
[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }

# Data types. These are allowed in `domain`: they describe values rather than
# machinery, and a core that cannot name a timestamp ends up passing strings
# across its own boundaries.
#
# `jiff` rather than chrono: § II requires an IANA zone identifier and says an
# offset is not a substitute. jiff's Timestamp/Zoned split is exactly that
# distinction, and it has no naive local type to reach for by accident.
jiff = "0.2.35"
sha2 = "0.11.0"
thiserror = "2.0.20"

# Adapters. Nothing below this line may appear in `domain` or `application`.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
# rustls, not native-tls: no OpenSSL, so the nix build needs no buildInputs.
# The feature is `rustls` — 0.13 renamed it from `rustls-tls`.
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  # Query-string building is feature-gated in 0.13.
  "query",
] }
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value` is load-bearing, not a convenience: RawValue borrows the exact
# source bytes of a sub-value, which is how a payload is stored as received
# (FR-002) without re-serialising a parsed Value and reordering its keys.
serde_json = { version = "1.0.151", features = ["raw_value"] }
sqlx = { version = "0.9.0", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "macros",
] }
clap = { version = "4.6.6", features = ["derive", "env"] }

# Test-only.
proptest = "1.11.0"
wiremock = "0.6.5"
tempfile = "3.27.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
must_use_candidate = "allow"
# Duplicate transitive versions are cargo-deny's business, not clippy's.
# `deny.toml` already rules on them (`bans.multiple-versions = "warn"`) and
# gives the reason: they arrive through someone else's dependency tree and are
# not ours to fix. This lint restates that judgement as a build failure, and
# restates it per crate — nine duplicate pairs became forty-nine warnings —
# with no way to accept one pair and keep watching the rest. Two checks
# disagreeing about the same fact is the thing to remove; the one that can
# express the nuance stays.
multiple_crate_versions = "allow"

# Constitution § 26: no panics and no unhandled errors.
#
# `forbid`, not `deny`: an `#[allow]` on a forbidden lint is a compile error
# (E0453), so this is not a rule an agent can grant itself an exception to.
# Relaxing it means editing this file, which is visible in review.
#
# Tests keep `unwrap` — the exemptions in `clippy.toml` are configuration, not
# attributes, so they survive `forbid`. A test asserting a value is present is
# not an unhandled error.
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
panic_in_result_fn = "forbid"
exit = "forbid"
# Unfinished code is not a standard to commit against (§ 33).
todo = "forbid"
unimplemented = "forbid"
# Left at `warn`: the noisiest of the set, and the one most likely to have a
# legitimate exception in parsing code.
indexing_slicing = "warn"

# Crane reads this to name the vendored-dependency derivation.
[workspace.metadata.crane]
name = "workspace"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Some optimization for dependencies, not full optimization.
#
# This was `3`, which optimises all ~300 dependencies at every clean build. That
# trade buys faster dependency *runtime*, and this workload has none worth
# buying: a few dozen HTTP requests and a few thousand records. What it costs is
# peak build memory, which is the binding constraint — a full-tree build at four
# parallel jobs is enough to stall the machine on memory.
[profile.dev.package."*"]
opt-level = 1
