name: Update flake lock

# Dependabot handles Cargo.toml and the actions, but not flake.lock.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# The caller has to ask for these. The repository's default workflow
# permissions are read-only, and a reusable workflow cannot grant itself
# more than its caller holds — so `nix-flake-update.yml`, which needs to
# push a branch and open a pull request, failed at startup with no jobs
# and no log every Monday from 2026-08-17 on. `release.yml` and
# `auto-merge.yml` declare the same pair for the same reason.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Runs `nix flake check` against the new inputs before opening anything, so
  # a broken update never becomes a pull request. That pull request will show
  # no checks of its own — GitHub raises no workflow events for the default
  # token — which is why the update is verified up front instead.
  update:
    uses: edpft/rust-workflows/.github/workflows/nix-flake-update.yml@main
