name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM: x86_64-linux

jobs:
  # The flake owns what runs: add an entry to `checks` in flake.nix and it
  # appears here as a new job, with no change to this workflow. Until
  # 2026-10-29 these jobs came from `edpft/rust-workflows`, which nothing else
  # used (the operator).
  discover:
    name: Discover checks
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
      unchanged: ${{ steps.unchanged.outputs.unchanged }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # The base commit has to be here to evaluate it.
          fetch-depth: 0

      - name: Install nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}

      - name: Restore cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}-prebuilt
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: List checks
        id: list
        run: |
          checks=$(nix eval --json ".#checks.${SYSTEM}" --apply 'builtins.attrNames')
          echo "checks=$checks" >> "$GITHUB_OUTPUT"

      # A check whose derivation is the base's has the base's result, so a pull
      # request that leaves its inputs alone need not build it. The flake's
      # filesets are the filter: no path list here to drift from them. It still
      # reports, because a required check that never reports blocks the merge.
      # Only pull requests skip: a push to `main` builds everything, which is
      # what keeps it the green baseline this comparison leans on.
      - name: Find unchanged checks
        id: unchanged
        run: |
          unchanged='[]'
          # A pull request's checkout is its merge commit; the first parent is
          # the base it was merged onto.
          if [ "$EVENT" = pull_request ] && git rev-parse --verify -q HEAD^2 >/dev/null; then
            base=$(git rev-parse HEAD^1)
            apply='cs: builtins.mapAttrs (_: c: c.drvPath) cs'
            # Outside the checkout, which must stay clean while it is evaluated.
            head_json="${RUNNER_TEMP}/head.json"
            base_json="${RUNNER_TEMP}/base.json"
            if nix eval --json ".#checks.${SYSTEM}" --apply "$apply" > "$head_json" \
              && nix eval --json "git+file://${PWD}?rev=${base}#checks.${SYSTEM}" --apply "$apply" > "$base_json"; then
              unchanged=$(jq -c -n --slurpfile h "$head_json" --slurpfile b "$base_json" \
                '$h[0] | to_entries | map(select($b[0][.key] == .value) | .key)')
            fi
          fi
          echo "Unchanged since the base: $unchanged"
          echo "unchanged=$unchanged" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}

  # Built once and cached for every check, instead of every check building
  # every dependency. Every job restores the one cache, and a key is written
  # once, so this job, which holds the dependencies, is the one that saves it.
  prebuild:
    name: Build shared dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Ubuntu's AppArmor refuses the user namespaces nix's sandbox needs.
      - name: Allow the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}
            # As on the laptop. Unsandboxed, each build runs in a directory of
            # its own name, and cargo, which records some sources by absolute
            # path, compiled again every crate a reused build had already
            # compiled (#645). No fallback: without one, a runner that cannot
            # sandbox builds without saying so.
            sandbox = true
            sandbox-fallback = false

      - name: Setup cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}-prebuilt
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Build the dependencies
        run: nix build -L .#cargoArtifacts

      # The workspace's crates, compiled once for every job (#645). Each job is
      # its own runner, so without this `test`, `doctest`, `cli`, `web` and
      # `publish` each compiled the workspace again. Only the build itself is
      # exported: all it refers to is the dependencies, which every job
      # restores from the cache.
      - name: Build the workspace
        run: |
          out=$(nix build -L --no-link --print-out-paths .#workspaceArtifacts)
          nix-store --export "$out" > "${RUNNER_TEMP}/workspace.nar"

      - name: Keep the workspace build
        uses: actions/upload-artifact@v7
        with:
          name: workspace-build
          path: ${{ runner.temp }}/workspace.nar
          retention-days: 1

  check:
    name: ${{ matrix.check }}
    needs: [discover, prebuild]
    # A failed prebuild must not skip these: GitHub counts a skipped required
    # check as passing. Run, rebuild the dependencies, and fail on their own
    # account.
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.discover.outputs.checks) }}
    env:
      CHECK: ${{ matrix.check }}
      UNCHANGED: ${{ contains(fromJson(needs.discover.outputs.unchanged), matrix.check) }}
    steps:
      # `cargo xtask import` reads this step's conclusion as the cache status
      # `unchanged`.
      - name: Skip, unchanged since the base
        if: ${{ env.UNCHANGED == 'true' }}
        run: echo "The derivation of ${CHECK} is the base's, so its result is too."

      - name: Checkout repo
        if: ${{ env.UNCHANGED != 'true' }}
        uses: actions/checkout@v7

      # Ubuntu's AppArmor refuses the user namespaces nix's sandbox needs.
      - name: Allow the sandbox
        if: ${{ env.UNCHANGED != 'true' }}
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install nix
        if: ${{ env.UNCHANGED != 'true' }}
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
            access-tokens = github.com=${{ github.token }}
            sandbox = true
            sandbox-fallback = false

      - name: Restore cache
        if: ${{ env.UNCHANGED != 'true' }}
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}-prebuilt
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      # From `prebuild`. Without it, as when `prebuild` failed, the check
      # builds the workspace itself.
      - name: Fetch the workspace build
        id: workspace
        if: ${{ env.UNCHANGED != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: workspace-build
          path: ${{ runner.temp }}/workspace

      - name: Import the workspace build
        if: ${{ env.UNCHANGED != 'true' && steps.workspace.outcome == 'success' }}
        run: nix-store --import < "${RUNNER_TEMP}/workspace/workspace.nar"

      # As `cargo xtask check` runs it, so a run here and a run on the laptop
      # are recorded alike (#629): nix-fast-build's result, with each check's
      # cache status, and the `test` check's JUnit report beside it.
      - name: Run check
        if: ${{ env.UNCHANGED != 'true' }}
        run: |
          mkdir -p results
          nix shell --inputs-from . nixpkgs#nix-fast-build --command \
            nix-fast-build --no-nom --skip-cached \
              --flake ".#checks.${SYSTEM}" \
              --select "checks: { inherit (checks) ${CHECK}; }" \
              --result-file results/result.json --result-format json

      - name: Keep the test report
        if: ${{ always() && env.UNCHANGED != 'true' }}
        run: |
          jq -r '.results[] | select(.type == "BUILD" and .success) | .outputs.out' results/result.json \
            | while read -r out; do
                if [ -f "$out/junit.xml" ]; then cp "$out/junit.xml" results/junit.xml; fi
              done

      - name: Upload the results
        if: ${{ always() && env.UNCHANGED != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: check-${{ matrix.check }}
          path: results/
          if-no-files-found: ignore

  # The one status the `main` ruleset requires (#147). It passes only when
  # every check passed, and the package built (#534), so a check added to
  # flake.nix gates a merge by construction rather than by someone remembering
  # to retype the ruleset's list. `always()` because GitHub counts a skipped
  # required check as passing: this job must run, and fail, when a job it needs
  # failed or was cancelled.
  gate:
    name: gate
    needs: [discover, check, publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed and the package built
        run: |
          echo "discover: ${DISCOVER}, checks: ${CHECKS}, publish: ${PUBLISH}"
          test "${DISCOVER}" = success
          test "${CHECKS}" = success
          test "${PUBLISH}" = success
        env:
          DISCOVER: ${{ needs.discover.result }}
          CHECKS: ${{ needs.check.result }}
          PUBLISH: ${{ needs.publish.result }}

  # The laptop installs what this pushes and builds nothing itself (#502): its
  # upgrade runs with `--max-jobs 0`. The checks never build the package, and
  # the flake bakes the commit into it, so a pull request's build is never
  # `main`'s. Built from the same `github:` reference the laptop resolves, so
  # the derivation is the one it will ask the cache for.
  #
  # **A pull request runs it as a dry run** (#534): every step up to the
  # pushes, so a bump to one of the actions below is tried before it reaches
  # `main`. It builds the pull request's head, reads Cachix without writing to
  # it, pushes nothing and moves no tag (the operator, 2026-10-21). The install
  # from the cache waits for `main` too, since nothing was pushed for it to
  # find. Dependabot's pull requests carry no secrets, so the push itself is
  # still first tried on `main`.
  publish:
    name: publish
    needs: [check]
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # To move the `published` tag.
    permissions:
      contents: write
    env:
      CACHE: edpft
      PUBLISHING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      REF: github:${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}#packages.x86_64-linux.default
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Ubuntu's AppArmor refuses the user namespaces nix's sandbox needs.
      - name: Allow the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # 2.31 rather than the action's default for the import trace below.
      - name: Install nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_version: 2.31.5
          nix_conf: |
            access-tokens = github.com=${{ github.token }}
            sandbox = true
            sandbox-fallback = false

      # The checks' dependencies, so the package does not rebuild them. Never
      # saved: the checks own the cache.
      - name: Restore cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock', '**/Cargo.lock', 'rust-toolchain.toml') }}-prebuilt
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      # As the checks do: the package is built on `prebuild`'s workspace build.
      - name: Fetch the workspace build
        id: workspace
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: workspace-build
          path: ${{ runner.temp }}/workspace

      - name: Import the workspace build
        if: ${{ steps.workspace.outcome == 'success' }}
        run: nix-store --import < "${RUNNER_TEMP}/workspace/workspace.nar"

      # Pushes only what is named below: by default it would push everything
      # the job built, toolchain and dependencies included.
      - name: Use Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Build the package, and push it from main
        run: |
          out=$(nix build -L --no-link --print-out-paths "$REF")
          if [ "$PUBLISHING" = true ]; then
            cachix push "$CACHE" "$out"
          fi

      # Evaluating the flake builds things too: fenix fetches the toolchain's
      # manifest at evaluation time, and without it in the cache the laptop
      # cannot even evaluate. Nix names each such build when asked to trace
      # them (2.30 and later), whether or not its output is already here. Not
      # found by building on an empty store: a store under another root needs
      # a sandbox to build into, and this runner builds without one.
      - name: Evaluate, and push what evaluation builds from main
        run: |
          if ! log=$(nix eval --no-eval-cache --option trace-import-from-derivation true --raw "${REF}.drvPath" 2>&1 >/dev/null); then
            echo "$log"
            exit 1
          fi
          mapfile -t drvs < <(grep -oP "built '\K/nix/store/[^'^]+\.drv(?=\^[^']*' during evaluation)" <<<"$log" | sort -u)
          echo "Evaluation builds: ${drvs[*]:-nothing}"
          if [ "$PUBLISHING" = true ] && [ "${#drvs[@]}" -gt 0 ]; then
            mapfile -t outs < <(nix-store --realise "${drvs[@]}")
            cachix push "$CACHE" "${outs[@]}"
          fi

      # The laptop's position: a store holding nothing, building nothing, and
      # only the caches to substitute from. Evaluation runs on it too, so a
      # manifest the cache does not serve fails here rather than there. The
      # options are the ones the laptop's nix.conf carries, for the reasons
      # given beside its upgrade in flake.nix; the negative cache matters here
      # too, since the build above asked Cachix for the manifest before it
      # was pushed.
      - name: Install as the laptop would
        if: ${{ env.PUBLISHING == 'true' }}
        run: |
          nix build --store "local?root=${RUNNER_TEMP}/laptop" --max-jobs 0 \
            --option always-allow-substitutes true \
            --option narinfo-cache-negative-ttl 0 \
            --no-link "$REF"

      # What the laptop installs: `main`'s head need not be, because a merge
      # made with this workflow's token (Dependabot's auto-merge) starts no
      # workflow, so its build is never pushed and a laptop following `main`
      # waits on it for good. The tag moves only once the install above has
      # passed, and a newer push cancels this run, so it never moves back.
      - name: Mark it published
        if: ${{ env.PUBLISHING == 'true' }}
        run: git push --force origin "${GITHUB_SHA}:refs/tags/published"
