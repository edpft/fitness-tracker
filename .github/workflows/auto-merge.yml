name: Auto Merge

on: pull_request

permissions:
    contents: write
    pull-requests: write

jobs:
    # Majors too (#534): the publish job's dry run now tries every action a
    # bump touches before `gate` passes, so a major merges on green like any
    # other bump.
    auto-merge:
        runs-on: ubuntu-latest
        # The pull request's author rather than `github.actor`, which is
        # whoever triggered this run: a human re-running the job, for instance.
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        steps:
            - name: Enable auto-merge
              run: gh pr merge --auto --merge "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ github.token }}
